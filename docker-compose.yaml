services:
  cloudops:
    build: .
    container_name: cloudops-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/cloudops.db"
    volumes:
      - ./data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: cloudops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cloudops
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: cloudops-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped